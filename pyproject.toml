[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slide2vec"
version = "7.1.1"
description = "Embedding of whole slide images with Foundation Models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Clément Grisi", email = "clement.grisi@radboudumc.nl" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "hs2p[asap,cucim,openslide,sam2,tifffile,vips]>=6.1.0",
    "omegaconf",
    "matplotlib",
    "pandas",
    "pillow",
    "rich",
    "torch",
    "torchvision",
    # <5: Hibou's remote code imports transformers.onnx and
    # pytorch_utils.find_pruneable_heads_and_indices, both removed in v5.
    # >=4.47: PRISM's configuring_prism.py needs sub_configs / base_config_key.
    "transformers>=4.47,<5",
    "wandb",
    "einops",
    # TITAN remote code (used by the built-in conchv15 preset) imports it.
    "einops-exts",
    # first release that registers vit_base_patch16_dinov3
    "timm>=1.0.20",
    "huggingface_hub",
    "packaging",
]

[project.urls]
Homepage = "https://github.com/clemsgrs/slide2vec"
"Bug Tracker" = "https://github.com/clemsgrs/slide2vec/issues"

[project.scripts]
slide2vec = "slide2vec.cli:entrypoint"

# Rule for extras: lower bounds only. An exact or upper pin is kept only when it
# is structural (the model's code breaks outside it); the reason sits next to
# the pin. A model whose stack conflicts with the shared stack gets its own
# extra and a uv conflict below. numpy<2 comes from hs2p[asap].
[project.optional-dependencies]
prism = [
    # perceiver.py calls torch.nn.attention.sdpa_kernel with a list (absent in 2.2)
    "torch>=2.3",
    "environs",
    "sacremoses",
]
prism2 = [
    "torch>=2.3",
    # the text (diagnostic) variant calls a Phi3Model helper whose signature
    # changed in 4.52 and which 4.53 removed; slide2vec.encoders.models.prism2
    # vendors it, so no upper bound. PRISM2 also imports flash_attn: add the
    # flash-attn extra (CUDA only, so not pulled in here)
    "transformers>=4.51,<5",
]
titan = [
    "einops",
    "einops-exts",
    "timm>=1.0.3",
    "transformers>=4.46,<5",
]
waiv = [
    # phaet and mascaret load with zero missing keys at the pinned revisions
    "transformers>=4.57",
]
# gigapath-slide needs flash-attn on GPUs with compute capability above 7
flash-attn = [
    "flash-attn>=2.6.3",
]
xformers = [
    # optional: PRISM's PERCEIVER_MEM_EFF_ATTN path; gigapath-slide needs it
    # on GPUs with compute capability 7 or below. Unpinned: each xformers
    # build pins its torch.
    "xformers",
]
fm = [
    "slide2vec[prism,prism2,titan,waiv]",
    # hard import in MUSK and gigapath-slide
    "fairscale",
]
# torch wheel flavour for uv; when neither is selected torch comes from PyPI
cpu = [
    "torch",
    "torchvision",
]
cu128 = [
    "torch",
    "torchvision",
]
docs = [
    "sphinx>=8.1",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]
testing = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "mypy>=0.910",
    "flake8>=3.9",
    "flake8-pyproject>=1.2.3",
    "tox>=3.24",
]

[dependency-groups]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "mypy>=0.910",
    "flake8>=3.9",
    "flake8-pyproject>=1.2.3",
    "tox>=3.24",
    # tests/test_encoder_plugins.py installs a plugin with `python -m pip`;
    # uv environments ship without pip
    "pip",
]
docs = [
    "sphinx>=8.1",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]
# encoder packages that are not on PyPI (musk, conch, gigapath-slide, sam2)
models-git = [
    "musk",
    "conch",
    "gigapath",
    "sam-2",
]

[tool.uv]
# ASAP and cucim are Linux-only. numpy<2 (from hs2p[asap]) has no wheels for
# Python 3.13+, so the lock covers Python 3.10 to 3.12.
environments = ["sys_platform == 'linux' and python_full_version < '3.13'"]
# Lock-only: the cu128 index stops at torch 2.11. Hold the CPU and PyPI forks at
# the same release so the CPU CI image tests the torch the CUDA image ships.
# This is not part of the published metadata.
constraint-dependencies = ["torch<2.12"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
]

# flash-attn ships only an sdist whose build imports torch; declare its metadata
# so uv can lock it without building it
[[tool.uv.dependency-metadata]]
name = "flash-attn"
requires-dist = ["torch", "einops"]

# flash-attn's setup.py imports torch, packaging, wheel and psutil. Build it in
# an isolated environment that holds the same torch as the runtime environment.
[tool.uv.extra-build-dependencies]
flash-attn = [
    { requirement = "torch", match-runtime = true },
    "packaging",
    "psutil",
    "wheel",
    "ninja",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
musk = { git = "https://github.com/lilab-stanford/MUSK.git" }
conch = { git = "https://github.com/Mahmoodlab/CONCH.git" }
gigapath = { git = "https://github.com/prov-gigapath/prov-gigapath.git" }
sam-2 = { git = "https://github.com/facebookresearch/sam2.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["slide2vec*"]

[tool.setuptools.package-data]
slide2vec = ["py.typed", "cufile.json"]
"slide2vec.configs" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "--cov=slide2vec -m 'not gpu_integration'"
testpaths = [
    "tests",
]
markers = [
    "heavy: real-weight foundation-model inference on CPU; minutes per test. Included in the PR suite and available separately through the manual heavy workflow (.github/workflows/nightly-heavy.yaml).",
    "gpu_integration: real one-GPU versus multi-GPU parity; requires at least two visible CUDA devices. Run explicitly with `CUDA_VISIBLE_DEVICES=0,1 python -m pytest -m gpu_integration --no-cov`.",
]

[tool.mypy]
mypy_path = "."
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true

[tool.flake8]
max-line-length = 160

[tool.bumpver]
current_version = "7.1.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit = false
tag = false
push = false
files = [
    "pyproject.toml",
    "slide2vec/__init__.py",
    "docs/conf.py",
]

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    '^current_version = "{version}"$',
    '^version = "{version}"$',
]
"slide2vec/__init__.py" = [
    '^__version__ = "{version}"$',
]
"docs/conf.py" = [
    '^release = "{version}"$',
]
