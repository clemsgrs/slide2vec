name: Heavy test suite

# Runs every `heavy`-marked test: real-weight CPU inference per model, about
# 45 minutes on a GitHub runner. Reuses the Dockerfile.ci image and its GHA
# cache.
#
# Manual dispatch only, to keep Actions minutes down. The PR suite
# (pr-test.yaml) runs the fast tests and, when a PR touches the pipeline, the
# PRISM end-to-end consistency test; the other heavy tests run only here. Run
# this workflow before a release.

on:
  workflow_dispatch:

jobs:
  heavy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      actions: write  # needed for Buildx GHA cache

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free disk space on runner
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: false
          load: true
          tags: slide2vec-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Guard required secret
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN is required but not set"; exit 1; }

      - name: Run heavy test suite in container
        run: |
          set -euo pipefail
          # Dependencies are baked into the image; install only the mounted source.
          docker run --rm \
            -e HF_TOKEN="$HF_TOKEN" \
            -v "$GITHUB_WORKSPACE:/opt/app" \
            slide2vec-ci:${{ github.sha }} \
            bash -lc '
              set -euo pipefail
              uv pip install --python /opt/venv/bin/python --no-deps -e /opt/app
              python -m pytest -q -m heavy --durations=15 tests
            '
